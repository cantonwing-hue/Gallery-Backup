name: cloud_photo_vault
description: Private Android photo and video backup to the user's own Google Drive, with verified cleanup.
publish_to: none
version: 0.1.1+2

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_sign_in: ^7.2.0
  googleapis: ^19.0.0
  http: ^1.5.0
  photo_manager: ^3.12.0
  sqflite: ^2.4.2
  path: ^1.9.1
  crypto: ^3.0.8
  shared_preferences: ^2.5.6
  connectivity_plus: ^7.3.2
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
